<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ADAPTIVE CHAR</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b7:#1B4B9B;--b6:#2160BF;--b5:#2F7BE6;--ink:#0F2347;--ink2:#5C6F8F}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Plus Jakarta Sans",Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#EEF4FE,#DDE9FC 55%,#CFE0FA) fixed;display:grid;grid-template-columns:188px 1fr;gap:12px;min-height:100%}
aside{margin:12px 0 12px 12px;border-radius:24px;background:linear-gradient(180deg,#1B4796,#2561C6);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;height:calc(100vh - 24px)}

.tag{margin-top:auto;background:rgba(255,255,255,.12);border-radius:16px;padding:12px;font-size:12px}
main{padding:12px 16px 24px 4px;min-width:0}.tb{display:flex;gap:10px;align-items:center;margin-bottom:6px}.tb input{flex:1;max-width:420px;border:0;border-radius:99px;padding:11px 18px;background:#fff;font:inherit}.tr{display:flex;gap:10px;align-items:center;margin-left:auto;position:relative}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 14px}.hd h1{margin:2px 0;font-size:26px;font-weight:800}.hd p{margin:0;color:var(--ink2)}.eb{color:var(--b6);font-weight:600;font-size:13px}.hr{display:flex;gap:10px;align-items:center}.lu{font-size:11px;color:var(--ink2);background:#ffffffa0;padding:6px 12px;border-radius:14px}.lu b{color:var(--ink);font-size:12px}
.g{display:grid;gap:14px;margin-bottom:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:1.1fr 1.5fr .9fr}.g3b{grid-template-columns:1.1fr 1fr .8fr}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 6px 24px rgba(30,70,150,.08);min-width:0}.card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.big{font-size:36px;font-weight:800;line-height:1.1}.up{color:#B45F06;font-size:12px;font-weight:600}.dn{color:#0B6B45;font-size:12px;font-weight:600}small,.sm{color:var(--ink2);font-size:12px}
.pill,.chip{display:inline-block;border-radius:99px;padding:3px 11px;font-weight:700;font-size:12px}.chip{background:#E8F0FD;color:var(--b7);font-weight:600;margin:2px}
.bt,.bt2,.ib,.lk{font:inherit;cursor:pointer;border-radius:12px;border:0}.bt{background:#1F5BB5;color:#fff;padding:9px 16px;font-weight:600}.bt2{background:#fff;border:1.5px solid var(--b5);color:var(--b7);padding:8px 14px;font-weight:600}.ib{background:#fff;width:40px;height:40px;border-radius:50%;position:relative;font-size:16px}.lk{background:none;color:var(--b6);font-weight:700;padding:2px 4px}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--b5);outline-offset:2px}
.sr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EEF2FA}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #EEF2FA}th{color:var(--ink2);font-weight:600}.sc{overflow:auto;max-height:300px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:0;border-radius:99px;padding:8px 16px;background:#E8F0FD;color:var(--b7);font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--b6);color:#fff}
.bd{position:absolute;top:-2px;right:-2px;background:#E5484D;color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-style:normal}.dd{position:absolute;right:60px;top:46px;width:300px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(30,70,150,.2);padding:12px;z-index:5}.ar{padding:6px 0;border-bottom:1px solid #EEF2FA;font-size:13px}
.user{display:flex;gap:8px;align-items:center;border:0;background:none;font:inherit;text-align:left;cursor:pointer}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5B9BF5,#1B4B9B);color:#fff;display:grid;place-items:center;font-weight:800}
.note{background:#FFF8DC;border-radius:12px;padding:8px 12px;font-size:12px;color:#7A5A00;margin-bottom:10px}.toast{position:fixed;right:16px;bottom:16px;background:#0F2347;color:#fff;padding:10px 16px;border-radius:12px;z-index:9}
.ov{position:fixed;inset:0;background:#0F234788;display:grid;place-items:center;z-index:8}.md{background:#fff;border-radius:18px;padding:20px;width:min(360px,92vw)}.md input,.f input{width:100%;padding:9px;border:1.5px solid #CFE0FA;border-radius:10px;font:inherit;margin:6px 0}
.bar{height:10px;border-radius:9px;background:#EEF2FA;overflow:hidden}.bar i{display:block;height:100%;background:var(--b5)}.ringw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media(max-width:1000px){.g4,.g3,.g3b{grid-template-columns:1fr 1fr}}
@media(max-width:700px){body{display:block}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;margin:8px;border-radius:18px;padding:10px}.lg,.tag{display:none}main{padding:8px}.g4,.g3,.g3b,.g2{grid-template-columns:1fr}.dd{right:0}}
@media print{aside,.tb,.hd{display:none}}
.card{transition:box-shadow .18s}.card:hover{box-shadow:0 10px 30px rgba(30,70,150,.15)}.pgi{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.spd{display:flex;gap:2px;background:#E8F0FD;border-radius:99px;padding:3px}.spd button{border:0;background:none;border-radius:99px;min-width:36px;padding:6px 8px;font:inherit;font-weight:700;font-size:12px;color:var(--b7);cursor:pointer}.spd button.on{background:var(--b6);color:#fff}
.ctip{position:fixed;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(30,70,150,.25);padding:8px 12px;font-size:12px;z-index:10;pointer-events:none}.sr[role=button]:hover{background:#F3F7FE}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside><div class=lg>ADAPTIVE CHAR<small>Smart Adsorption for Clean Water</small></div>
<a href="#/dashboard" data-p=dashboard>Dashboard</a><a href="#/monitoring" data-p=monitoring>Monitoring</a><a href="#/simulation" data-p=simulation>Simulation</a><a href="#/reports" data-p=reports>Reports</a><a href="#/settings" data-p=settings>Settings</a>
<div class=tag>🍃 Towards Smarter &amp; Greener Water Treatment</div></aside>
<main><div class=tb><input id=q placeholder="Search metrics, batch, or parameter…" aria-label=Search><div id=tr class=tr></div></div><div id=pg></div></main>
<input type=file id=fi accept=".csv" hidden>
<script>
const $=s=>document.querySelector(s),f0=Math.round;
const P={Cth:300,d:60,N:3,Tfix:12,kw:.25,ef:.88,Q:100,m:5,safe:true,mode:'Advisory'};
try{Object.assign(P,JSON.parse(localStorage.getItem('acp')||'{}'))}catch(e){}
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mkg=r=>()=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(6.2832*r());
const gn=mkg(rng(20261014));
const curve=(t,t50,ce=1000)=>120+(ce-120)/(1+Math.exp(-.206*(t-t50)));
const SC={N:['Normal','#1FA971','#DDF5EA','#0B6B45','✓'],P:['Peringatan','#F2B705','#FFF1C2','#7A5A00','⚠'],E:['Evaluasi Efluen','#F08A24','#FFE5CC','#8A4300','◔'],S:['Penghentian Adsorpsi','#E5484D','#FDE0E1','#9B1C20','■'],A:['Mode Aman','#7C5CD6','#E9E3FB','#46308F','⏸']};
const pill=s=>`<span class=pill style="background:${SC[s][2]};color:${SC[s][3]}">${SC[s][4]} ${SC[s][0]}</span>`;
/* ===== Mesin keputusan (Bab 4.3.4) ===== */
const init=()=>({s:'N',n:0,cl:0,w:[],tc:0,k:0,pump:1,xv:'Temporary Storage',conf:false,why:'Sesi dimulai.'});
function act(st,p,low){st.xv=st.s==='N'?'Temporary Storage':'Verification Tank';st.pump=(st.s==='A'||(st.s==='S'&&p.mode==='Auto'&&!low))?0:1;return st}
function step(o,r,p=P,low=false){
 const st={...o,w:[...o.w]},bad=r==='x'||r==='E'||r==='T',Cw=p.Cth-p.d;
 if(st.s==='S'||st.s==='A')return st;
 st.k++;st.w.push(bad?1:0);if(st.w.length>6)st.w.shift();
 st.tc=r==='T'?st.tc+1:0;const inv=st.w.reduce((a,b)=>a+b,0);
 if(r==='E'||st.tc>=3||(inv>=3&&p.safe)){st.s='A';st.why=r==='E'?'Prediksi gagal; Mode Aman, menunggu pemeriksaan operator.':st.tc>=3?'Komunikasi terputus 3 interval; Mode Aman.':'≥3 pembacaan tidak valid dalam 6 terakhir; Mode Aman.';return act(st,p,low)}
 if(bad){st.n=0;st.why='Pembacaan tidak valid; penghitung pelampauan direset, status ditahan.';return st}
 const c=Math.round(r);st.n=r>=p.Cth?st.n+1:0;
 if(st.n>=p.N){st.s='S';st.why=`Estimasi COD ${c} mg/L ≥ ambang ${p.Cth} mg/L pada ${p.N} pembacaan valid berturut-turut.`+(st.k<=p.N?' Target mutu tidak dapat dicapai satu kolom; perlu pengolahan lanjutan atau kolom seri.':'')}
 else if(r>=p.Cth){st.s='E';st.cl=0;st.why=`Estimasi COD ${c} mg/L ≥ ambang ${p.Cth}; pelampauan valid ${st.n} dari ${p.N}; efluen dialihkan ke tangki verifikasi.`}
 else if(r>=Cw){st.s='P';st.cl=0;st.why=`Estimasi COD ${c} mg/L ≥ batas peringatan ${Cw} mg/L; ambang ${p.Cth} belum terlampaui; pelampauan 0/${p.N}.`}
 else{st.cl++;if(st.s!=='N'&&st.cl>=3)st.s='N';st.why=`Estimasi COD ${c} mg/L < batas peringatan ${Cw} mg/L; kondisi aman.`}
 return act(st,p,low)}
const reset=(st,lab,why)=>lab&&why?init():null,labErr=(a,b)=>({e:Math.abs(a-b),w:Math.abs(a-b)>100});
const CSVC=['timestamp','pH','turbidity','color','conductivity','temperature','elapsed_h'];
function vcsv(t){const L=t.trim().split(/\r?\n/),h=L[0].split(',').map(x=>x.trim()),e=[];CSVC.forEach(c=>{if(!h.includes(c))e.push('Kolom hilang: '+c)});L.slice(1).forEach((l,i)=>l.split(',').forEach((v,j)=>{if(j>0&&h[j]&&h[j]!=='timestamp'&&isNaN(+v))e.push(`Baris ${i+2}, kolom ${h[j]}: bukan angka`)}));return e}
/* ===== TC-01..TC-14 (headless) ===== */
const DEF={Cth:300,d:60,N:3,safe:true,mode:'Advisory'},S4=[262,305,311,318,200];
const run=(q,p={},low)=>{let st=init(),o='';const pp={...P,...DEF,...p};for(const r of q){st=step(st,r,pp,low);o+=st.s}return{st,o}};
const TCS=[['TC-01','Normal Operation',()=>run([190,200,205,210,215]).o==='NNNNN'],['TC-02','Warning Zone',()=>run([220,236,244,252,248]).o==='NNPPP'],['TC-03','Transient Exceedance',()=>run([250,305,310,280,262]).o==='PEEPP'],
['TC-04','Stop After 3 Consecutive',()=>{const x=run(S4,{mode:'Auto'});return x.o==='PEESS'&&x.st.pump===0}],['TC-05','Missing Reading Resets Counter',()=>run([305,310,'x',315,320,325]).o==='EEEEES'],
['TC-06','Alternating Invalid',()=>run([305,'x',310,'x',315,'x',312]).o==='EEEEEAA'],['TC-07','Color Sensor Dropout',()=>run([250,252,'x','x','x']).o==='PPPPA'&&run([250,252,'x','x','x'],{safe:false}).st.s==='P'],
['TC-08','Prediction/Comms Failure',()=>run([220,'E']).o==='NA'&&run([220,'T','T','T']).o==='NNNA'],['TC-09','Out-of-Distribution Input',()=>{const x=run([310,312,315],{mode:'Auto'},true);return x.o==='EES'&&x.st.pump===1}],
['TC-10','Reset Without Verification',()=>{const x=run(S4,{mode:'Auto'});return reset(x.st,false,'Media replaced')===null&&reset(x.st,true,'Media replaced').s==='N'}],
['TC-11','Advisory vs Auto',()=>{const a=run(S4),b=run(S4,{mode:'Auto'});return a.o==='PEESS'&&a.st.pump===1&&b.st.pump===0}],
['TC-12','Invalid CSV Upload',()=>vcsv('timestamp,pH,turbidity,conductivity,temperature,elapsed_h\n1,7,abc,1000,30,1').length>=2],['TC-13','Large Lab Error',()=>{const l=labErr(250,480);return l.e===230&&l.w}],
['TC-14','Influent Above Threshold',()=>{const x=run([320,325,330]);return x.o==='EES'&&x.st.why.includes('kolom seri')}]];
const runTests=()=>TCS.map(([id,n,f])=>{let ok=false;try{ok=f()}catch(e){}return{id,n,ok}});
/* ===== Metrik perbandingan ===== */
function sess(t50,g,ce=1000){let st=init(),tb=null,Ta=null;for(let h=0;h<60;h+=1/12){const tr=curve(h,t50,ce);if(tb===null&&tr>=P.Cth)tb=h;st=step(st,Math.max(0,tr*1.02+g()*10),P);if(st.s==='S'){Ta=h;break}}return{t50,tb:tb??0,Ta:Ta??60}}
function agg(rows,Tf,Q=P.Q){let ok=0,E=0,okf=0,Ef=0;rows.forEach(x=>{ok+=Q*Math.min(x.Ta,x.tb);E+=P.kw*x.Ta;okf+=Q*Math.min(Tf,x.tb);Ef+=P.kw*Tf});const K=rows.length,e=E/ok,ef=Ef/okf,a=P.m*K/ok,af=P.m*K/okf,en=(ef-e)/ef*100,ad=(af-a)/af*100;return{rows,en,ad,eff:(en+ad)/2,E,Ef,co2:E*P.ef,co2f:Ef*P.ef,red:(Ef-E)/Ef*100}}
const calc=()=>{const g=mkg(rng(7)),r=[];for(let k=0;k<8;k++)r.push(sess(21.1*Math.exp(.3*g()),g));return agg(r,P.Tfix)};
/* ===== Sesi live ===== */
let calib=false,flt="",spd=1,hov=false,CD=null,tmr=null,live=false,now=new Date(2026,9,14,3,15).getTime(),up=72.5,role='Operator',page='dashboard',showAl=false,mon='cod',rp='perf',stt='gen',ver=[{v:'v1.0',t:'Default',r:'Initial'}];
let ses={id:'A230',t50:14.1,t0:now,st:init(),H:[],lab:false},ev=[],labs=[],al=[];
const addEv=(l,m)=>ev.unshift({t:now,l,m}),addAl=(l,m)=>{al.unshift({t:now,l,m,ack:false});addEv(l,m);if(live&&l!=="Info")toast(l+": "+m)};
function tick(){now+=3e5;up+=1/12;if(!ses.st.pump)return;const h=(now-ses.t0)/36e5,tr=curve(h,ses.t50),c=Math.max(0,tr*1.02+gn()*10),old=ses.st.s;ses.st=step(ses.st,(!flt||flt==="O")?c:flt,P,flt==="O");ses.H.push({t:now,h,c,tr,s:ses.st.s,n:ses.st.n});
 if(ses.st.s!==old)addAl(ses.st.s==='S'||ses.st.s==='A'?'Critical':ses.st.s==='N'?'Info':'Warning',`Status: ${SC[ses.st.s][0]} (COD ${f0(c)} mg/L)`)}
addEv('Info','Sesi simulasi dimulai (Batch #A230)');for(let i=0;i<66;i++)tick();up=72.5;live=true;
al.push({t:now-6e5,l:'Warning',m:'Color sensor needs calibration (TCS3200)',ack:false},{t:now-3e5,l:'Info',m:'Model prediksi diverifikasi (up to date)',ack:false});
let tres=runTests(),CMP=calc(),sm={Cin:1000,Q:100,Tf:12,adv:false,res:null,tab:'chart'};
/* ===== Util UI ===== */
const can=()=>role!=='Viewer',lastC=()=>ses.H.length?ses.H[ses.H.length-1]:{c:0,h:0,s:'N',n:0};
const dt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),tm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3500)};
function ask(t,v,cb){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class=md><h3>${t}</h3><input value="${v}"><div class=row><button class=bt2>Cancel</button><button class=bt>OK</button></div></div>`;document.body.append(m);const i=m.querySelector('input');i.focus();m.querySelector('.bt2').onclick=()=>m.remove();m.querySelector('.bt').onclick=()=>{cb(i.value);m.remove()}}
const save=()=>{try{localStorage.setItem('acp',JSON.stringify(P))}catch(e){}};
const spark=(a,c='#2F7BE6',w=90,h=30)=>{if(a.length<2)return'';const mn=Math.min(...a),r=(Math.max(...a)-mn)||1;return`<svg width=${w} height=${h}><polyline fill=none stroke="${c}" stroke-width=2 points="${a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(' ')}"/></svg>`};
const sens=c=>({pH:7.2-(c-248)/1500,turb:12.5*Math.pow(Math.max(c,1)/248,.8),color:43*c/248,cond:1150+(c-248)*.6,temp:31.2});
const rel=()=>{let s=75;if(!labs.length)s-=20;const l=labs[labs.length-1];if(l&&l.e>100)s-=30;return[s,s>=70?'High':s>=40?'Medium':'Low']};
function chart(S,o){const W=600,Ht=230,L=34,B=24,T=12,X=x=>L+x/o.xmax*(W-L-8),Y=y=>Ht-B-Math.min(Math.max(y,0),o.ymax)/o.ymax*(Ht-B-T);let g='';
 for(let v=0;v<=o.ymax;v+=o.ymax/4)g+=`<line x1=${L} x2=${W-8} y1=${Y(v)} y2=${Y(v)} stroke="#E6EDF8"/><text x=2 y=${Y(v)+4} font-size=10 fill="#5C6F8F">${f0(v)}</text>`;
 for(let x=0;x<=o.xmax;x+=o.xt)g+=`<text x=${X(x)} y=${Ht-6} font-size=10 text-anchor=middle fill="#5C6F8F">${x}h</text>`;
 if(o.band&&o.band.length>1)g+=`<polygon fill="#2F7BE6" opacity=.13 points="${o.band.map(b=>X(b[0])+','+Y(b[2])).join(' ')+' '+o.band.slice().reverse().map(b=>X(b[0])+','+Y(b[1])).join(' ')}"/>`;
 (o.hl||[]).forEach(l=>g+=`<line x1=${L} x2=${W-8} y1=${Y(l.y)} y2=${Y(l.y)} stroke="${l.c}" stroke-dasharray="${l.d}" stroke-width=1.5 />`);
 S.forEach(s=>{if(s.p.length>1)g+=`<polyline fill=none stroke="${s.c}" stroke-width=${s.w||2} ${s.d?`stroke-dasharray="${s.d}"`:''} stroke-linejoin=round points="${s.p.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ')}"/>`});
 (o.vl||[]).forEach(v=>g+=`<line x1=${X(v.x)} x2=${X(v.x)} y1=${T} y2=${Ht-B} stroke="${v.c}" stroke-dasharray="4 3" stroke-width=1.6 /><text x=${Math.min(X(v.x)+4,W-150)} y=${T+10+(v.o||0)} font-size=10 font-weight=700 fill="${v.tc||'#7A5A00'}">${v.t}</text>`);
 (o.lab||[]).forEach(q=>g+=`<path d="M${X(q[0])} ${Y(q[1])-5}l5 5-5 5-5-5z" fill="#1E3358"/>`);
 CD={S,o};return`<svg viewBox="0 0 ${W} ${Ht}" width=100% role=img aria-label="Grafik" style="cursor:crosshair" onmousemove="ctip(event)" onmouseleave="ctipOff()">${g}<line id=xh y1=${T} y2=${Ht-B} stroke="#1B4B9B" stroke-width=1 opacity=0 /></svg>`}
const card=(t,b,c='')=>`<section class="card ${c}"><h3>${t}</h3>${b}</section>`;
const hd=(e,t,s)=>`<header class=hd><div><div class=eb>● ${e}</div><h1>${t}</h1><p>${s}</p></div><div class=hr><span class=pill style="background:${flt==="T"?"#FFF1C2":"#DDF5EA"};color:${flt==="T"?"#7A5A00":"#0B6B45"}">${flt==="T"?"● Degraded":"● System Online"}</span><span class=spd role=group aria-label="Kecepatan simulasi">${[[0,"⏸"],[1,"x1"],[4,"x4"],[12,"x12"]].map(q=>`<button class="${spd===q[0]?"on":""}" aria-pressed="${spd===q[0]}" aria-label="${q[0]?"Kecepatan "+q[1]:"Pause"}" onclick="setSpd(${q[0]})">${q[1]}</button>`).join("")}</span><span class=lu>Last Update<br><b>${dt(now)}</b></span><button class=ib title=Refresh aria-label=Refresh onclick="tick();render()">⟳</button></div></header>${flt?`<div class=note style="background:#FDE0E1;color:#9B1C20">⚠ Fault injected: ${FN[flt]} · <button class=lk onclick="setFlt('')">Clear faults</button></div>`:""}`;

 t.style.left=Math.min(e.clientX+14,innerWidth-170)+'px';t.style.top=e.clientY-10+'px';t.innerHTML=`<b>${b[0].toFixed(2)} h</b><br>`+ss.map(q=>`${q.n||'Nilai'}: <b>${(near(q.p)[1]).toFixed(1)}</b>`).join('<br>');
